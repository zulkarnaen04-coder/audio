<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tebak Alat Musik Tradisional Indonesia</title>
  <style>
    :root {
      --bg-color: #06070d;
      --card-bg: radial-gradient(circle, #1a1b26 0%, #0c0d14 100%);
      --neon-cyan: #00f3ff;
      --neon-pink: #ff007f;
      --neon-green: #39ff14;
      --neon-yellow: #ffe600;
      --neon-purple: #9d4edd;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-color);
      font-family: 'Segoe UI', Roboto, Arial, sans-serif;
      color: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }

    header {
      text-align: center;
      margin-bottom: 20px;
    }

    h1 {
      font-size: 2.1rem;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: #fff;
      text-shadow: 0 0 10px var(--neon-cyan), 0 0 25px var(--neon-cyan);
      margin-bottom: 12px;
    }

    /* Modal Form Identitas & Game Over */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.85);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    .modal-box {
      background: #1a1b26;
      border: 2px solid var(--neon-cyan);
      box-shadow: 0 0 25px var(--neon-cyan);
      border-radius: 16px;
      padding: 30px;
      width: 90%;
      max-width: 400px;
      text-align: center;
    }

    .modal-box h2 {
      margin-bottom: 15px;
      color: var(--neon-cyan);
    }

    .modal-box input {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      background: #0c0d14;
      color: #fff;
      font-size: 1rem;
    }

    .btn-submit {
      background: linear-gradient(45deg, var(--neon-green), var(--neon-cyan));
      border: none;
      color: #000;
      padding: 12px 24px;
      font-size: 1rem;
      font-weight: bold;
      border-radius: 30px;
      cursor: pointer;
      width: 100%;
      margin-top: 15px;
      transition: all 0.3s ease;
    }

    .status-panel {
      display: flex;
      gap: 15px;
      justify-content: center;
      align-items: center;
      background: rgba(255, 255, 255, 0.05);
      padding: 10px 25px;
      border-radius: 50px;
      border: 1px solid rgba(0, 243, 255, 0.4);
      box-shadow: 0 0 15px rgba(0, 243, 255, 0.2);
      flex-wrap: wrap;
    }

    .btn-play {
      background: linear-gradient(45deg, var(--neon-pink), var(--neon-purple));
      border: none;
      color: white;
      padding: 12px 24px;
      font-size: 1rem;
      font-weight: bold;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 0 15px var(--neon-pink);
      transition: all 0.3s ease;
      text-transform: uppercase;
    }

    .btn-play:hover {
      transform: scale(1.05);
      box-shadow: 0 0 25px var(--neon-pink);
    }

    .score-board {
      font-size: 1.1rem;
      font-weight: bold;
      color: var(--neon-green);
      text-shadow: 0 0 10px var(--neon-green);
    }

    .profession-board {
      font-size: 1.1rem;
      font-weight: bold;
      color: var(--neon-yellow);
      text-shadow: 0 0 10px var(--neon-yellow);
    }

    #message {
      margin-top: 15px;
      font-size: 1.2rem;
      font-weight: bold;
      min-height: 32px;
      text-align: center;
    }

    .msg-success { color: var(--neon-green); text-shadow: 0 0 12px var(--neon-green); }
    .msg-error { color: var(--neon-pink); text-shadow: 0 0 12px var(--neon-pink); }

    .grid-container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 20px;
      width: 100%;
      max-width: 1250px;
      margin-top: 15px;
    }

    .instrument-card {
      background: var(--card-bg);
      border-radius: 14px;
      aspect-ratio: 3 / 4;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      position: relative;
      border: 2px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 8px 20px rgba(0,0,0,0.8);
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      padding: 10px;
      overflow: hidden;
    }

    .instrument-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 8px;
    }

    .instrument-card:hover {
      transform: translateY(-8px) scale(1.04);
      border-color: var(--card-neon-color);
      box-shadow: 0 0 25px var(--card-neon-color), inset 0 0 15px var(--card-neon-color);
    }

    .instrument-card.correct {
      border-color: var(--neon-green) !important;
      box-shadow: 0 0 40px var(--neon-green), inset 0 0 20px var(--neon-green) !important;
      animation: pulse-correct 0.6s ease;
    }

    .instrument-card.wrong {
      border-color: #ff0000 !important;
      box-shadow: 0 0 35px #ff0000, inset 0 0 15px #ff0000 !important;
      animation: shake 0.4s ease;
    }

    @keyframes pulse-correct {
      0% { transform: scale(1); }
      50% { transform: scale(1.1); }
      100% { transform: scale(1); }
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-8px); }
      40%, 80% { transform: translateX(8px); }
    }
  </style>
</head>
<body>

  <!-- Modal Identitas Siswa -->
  <div class="modal-overlay" id="modalIdentitas">
    <div class="modal-box">
      <h2>Isi Identitas Siswa</h2>
      <input type="text" id="inputNama" placeholder="Nama Lengkap" required>
      <input type="text" id="inputKelas" placeholder="Kelas (misal: 8A)" required>
      <button class="btn-submit" id="btnMulai">Mulai Kuis 🚀</button>
    </div>
  </div>

  <!-- Modal Game Over -->
  <div class="modal-overlay" id="modalGameOver" style="display: none;">
    <div class="modal-box" id="gameOverBox" style="border-color: var(--neon-pink); box-shadow: 0 0 25px var(--neon-pink);">
      <h2 id="gameOverTitle" style="color: var(--neon-pink);">KUIS SELESAI! ❌</h2>
      <p id="gameOverReason" style="margin: 15px 0; font-size: 1.1rem;">Kesempatan kamu sudah habis (3x Salah).</p>
      <p style="font-size: 1.3rem; font-weight: bold; color: var(--neon-green);">Skor Akhir: <span id="finalScore">0</span> / 100</p>
      <p style="font-size: 1.2rem; margin-top: 10px;">Status Profesi: <span id="finalProfession">🍽️ Cuci Piring</span></p>
      <p id="sendStatus" style="margin-top: 10px; font-size: 0.9rem; color: var(--neon-yellow);">Mengirim data ke guru...</p>
      <button class="btn-submit" onclick="location.reload()" style="background: linear-gradient(45deg, var(--neon-pink), var(--neon-purple)); color: #fff;">Main Lagi 🔄</button>
    </div>
  </div>

  <header>
    <h1>Tebak Alat Musik Tradisional Indonesia</h1>
    <div class="status-panel">
      <button class="btn-play" id="btnPlay">🎼 Putar Suara Target</button>
      <div class="score-board">Skor: <span id="score">0</span> / 100</div>
      <div class="profession-board">Profesi: <span id="professionIcon">🍽️ Cuci Piring</span></div>
    </div>
    <div id="message">Klik tombol "Putar Suara Target" untuk memulai!</div>
  </header>

  <div class="grid-container" id="grid"></div>

  <script>
    // MASUKKAN URL GOOGLE APPS SCRIPT KAMU DI SINI
    const URL_GOOGLE_SHEETS = "GANTI_DENGAN_URL_WEB_APP_GOOGLE_APPS_SCRIPT_KAMU";

    let siswaNama = "";
    let siswaKelas = "";
    let wrongCount = 0;
    const maxWrong = 3;
    const maxScore = 100;
    let isGameOver = false;

    document.getElementById('btnMulai').addEventListener('click', () => {
      const nama = document.getElementById('inputNama').value.trim();
      const kelas = document.getElementById('inputKelas').value.trim();

      if (!nama || !kelas) {
        alert("Harap isi Nama dan Kelas terlebih dahulu!");
        return;
      }

      siswaNama = nama;
      siswaKelas = kelas;
      document.getElementById('modalIdentitas').style.display = 'none';
      updateProfessionDisplay();
    });

    function getProfessionStatus(currentScore) {
      if (currentScore >= 100) {
        return "👑 Presiden";
      } else if (currentScore > 80) {
        return "💼 Menteri";
      } else if (currentScore === 80) {
        return "👨‍🏫 Guru";
      } else {
        return "🍽️ Cuci Piring";
      }
    }

    function updateProfessionDisplay() {
      const profession = getProfessionStatus(score);
      document.getElementById('professionIcon').textContent = profession;
    }

    function sendScoreToGSheet(skor) {
      const statusEl = document.getElementById('sendStatus');
      if (!URL_GOOGLE_SHEETS || URL_GOOGLE_SHEETS.includes("GANTI_DENGAN_URL")) {
        statusEl.textContent = "Data tidak terhubung ke Google Sheets (URL belum diisi).";
        return;
      }

      fetch(URL_GOOGLE_SHEETS, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          nama: siswaNama,
          kelas: siswaKelas,
          skor: skor
        })
      }).then(() => {
        statusEl.textContent = "✅ Nilai berhasil terkirim ke Guru!";
      }).catch(err => {
        console.error("Gagal mengirim skor:", err);
        statusEl.textContent = "❌ Gagal mengirim nilai ke Google Sheets.";
      });
    }

    function triggerGameOver(reasonMessage = "Kesempatan kamu sudah habis (3x Salah).") {
      isGameOver = true;
      isPlaying = false;
      
      const profession = getProfessionStatus(score);
      document.getElementById('finalScore').textContent = score;
      document.getElementById('finalProfession').textContent = profession;
      document.getElementById('gameOverReason').textContent = reasonMessage;
      
      if (score >= maxScore) {
        document.getElementById('gameOverTitle').textContent = "SELAMAT! KUIS SELESAI! 🎉";
        document.getElementById('gameOverTitle').style.color = "var(--neon-green)";
        document.getElementById('gameOverBox').style.borderColor = "var(--neon-green)";
        document.getElementById('gameOverBox').style.boxShadow = "0 0 25px var(--neon-green)";
      }

      document.getElementById('modalGameOver').style.display = 'flex';
      
      // Kirim skor akhir ke Google Sheets saat game over
      sendScoreToGSheet(score);
    }

    function driveImageUrl(fileId) {
      return `https://lh3.googleusercontent.com/d/${fileId}`;
    }

    const instrumentsData = {
      sasando: { name: "Sasando", audioFile: "sasando.mp3", imageId: "1iLAIIOUyKm1OW40_aSPSoFwn07rys6YC" },
      akordeon: { name: "Akordeon", audioFile: "akordeon.mp3", imageId: "1KRk0kbHbZCe-HBsOqHC4Ei60qa85zPkX" },
      kompang: { name: "Kompang", audioFile: "kompang.mp3", imageId: "1HgXPEtOY1eqAOv9hQr6spGM4tCUE5loj" },
      gendang_melayu: { name: "Gendang Melayu", audioFile: "gendangmelayu.mp3", imageId: "1NWIItCaOID8OtXzeUaqCkiH66ZJyBvXY" },
      saluang: { name: "Saluang", audioFile: "saluang.mp3", imageId: "1RIMfOIRL8a_SzQPHLsR_Yelqnco7RDym" },
      bansi: { name: "Bansi", audioFile: "bansi.mp3", imageId: "12Og8Hhu1Bs3egLXZVNMUBxTFzyl36YXo" },
      gamelan: { name: "Gamelan", audioFile: "gamelan.mp3", imageId: "1m5GpYfqLGQ6vI_1SweKGEMt6qLrKQl0M" },
      marwas: { name: "Marwas", audioFile: "marwas.mp3", imageId: "181mdCNBlMkjCmlwJUKB9_alPRNT1IGVL" },
      biola: { name: "Biola", audioFile: "biola.mp3", imageId: "1rKICH8zisMy76s1m4h_bd1RCgeIidpYG" },
      gondang_batak: { name: "Gondang Batak", audioFile: "gondangbatak.mp3", imageId: "10rTmVKfJDkGmSVLbtRKCky02tigU0fDc" },
      talempong: { name: "Talempong", audioFile: "talempong.mp3", imageId: "1F_1-qD_IvmdE1_LIXazehXRCry0I2KcU" }
    };

    let currentAudio = null;

    function playAudio(fileName) {
      if (!fileName || isGameOver) return;

      if (currentAudio) {
        currentAudio.pause();
        currentAudio.currentTime = 0;
      }

      currentAudio = new Audio(`./${fileName}`);

      currentAudio.play().then(() => {
        if (isPlaying) {
          messageEl.textContent = "Dengarkan baik-baik... Gambar mana yang bersuara seperti ini?";
          messageEl.className = "";
        }
      }).catch(err => {
        console.error("Gagal memutar audio:", err);
        messageEl.textContent = "Error: File audio tidak ditemukan!";
        messageEl.className = "msg-error";
      });
    }

    const neonColors = ['#00f3ff', '#ff007f', '#39ff14', '#ffe600', '#9d4edd'];
    const instrumentKeys = Object.keys(instrumentsData);
    let targetKey = '';
    let score = 0;
    let isPlaying = false;

    const gridEl = document.getElementById('grid');
    const btnPlayEl = document.getElementById('btnPlay');
    const scoreEl = document.getElementById('score');
    const messageEl = document.getElementById('message');

    function renderCards() {
      gridEl.innerHTML = '';
      const shuffled = [...instrumentKeys].sort(() => Math.random() - 0.5);

      shuffled.forEach((key, index) => {
        const item = instrumentsData[key];
        const card = document.createElement('div');
        card.classList.add('instrument-card');
        const color = neonColors[index % neonColors.length];
        card.style.setProperty('--card-neon-color', color);

        const img = document.createElement('img');
        img.src = driveImageUrl(item.imageId);
        img.alt = item.name;
        card.appendChild(img);

        card.dataset.key = key;
        card.addEventListener('click', () => handleCardClick(card, key));
        gridEl.appendChild(card);
      });
    }

    function pickRandomTarget() {
      const randomIndex = Math.floor(Math.random() * instrumentKeys.length);
      targetKey = instrumentKeys[randomIndex];
    }

    btnPlayEl.addEventListener('click', () => {
      if (isGameOver) return;
      if (!targetKey) {
        pickRandomTarget();
      }
      isPlaying = true;
      playAudio(instrumentsData[targetKey].audioFile);
    });

    function handleCardClick(card, clickedKey) {
      if (isGameOver) return;

      playAudio(instrumentsData[clickedKey].audioFile);

      if (!isPlaying) {
        messageEl.textContent = "Klik 'Putar Suara Target' terlebih dahulu!";
        messageEl.className = "msg-error";
        return;
      }

      if (clickedKey === targetKey) {
        score += 10;
        if (score > maxScore) score = maxScore;
        
        scoreEl.textContent = score;
        updateProfessionDisplay();
        card.classList.add('correct');

        const realName = instrumentsData[clickedKey].name;
        messageEl.textContent = `KAMU BENAR! Ini adalah ${realName} 🎉`;
        messageEl.className = "msg-success";
        isPlaying = false;

        if (score >= maxScore) {
          setTimeout(() => {
            card.classList.remove('correct');
            triggerGameOver("Selamat! Kamu berhasil mencapai skor maksimal 100!");
          }, 1500);
          return;
        }

        setTimeout(() => {
          card.classList.remove('correct');
          pickRandomTarget();
          messageEl.textContent = "Klik 'Putar Suara Target' untuk melanjutkan!";
          messageEl.className = "";
        }, 2000);

      } else {
        wrongCount++;
        card.classList.add('wrong');

        if (wrongCount >= maxWrong) {
          messageEl.textContent = "Salah! Kesempatan kamu sudah habis.";
          messageEl.className = "msg-error";
          setTimeout(() => {
            card.classList.remove('wrong');
            triggerGameOver("Kesempatan kamu sudah habis (3x Salah).");
          }, 800);
        } else {
          messageEl.textContent = `Salah! Sisa kesempatan: ${maxWrong - wrongCount}x lagi.`;
          messageEl.className = "msg-error";

          setTimeout(() => {
            card.classList.remove('wrong');
          }, 600);
        }
      }
    }

    renderCards();
    pickRandomTarget();
  </script>
</body>
</html>
